name: Build Plugin

permissions:
  contents: write

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check version consistency
        env:
          GITHUB_REF: ${{ github.ref }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          set -e
          GRADLE_VERSION=$(grep '^version=' gradle.properties | head -1 | cut -d= -f2 | tr -d '[:space:]')
          MANIFEST_VERSION=$(python3 -c "import json; print(json.load(open('src/main/resources/manifest.json'))['Version'])")
          echo "gradle.properties version: ${GRADLE_VERSION}"
          echo "manifest.json Version: ${MANIFEST_VERSION}"
          if [ "${GRADLE_VERSION}" != "${MANIFEST_VERSION}" ]; then
            echo "::error::manifest.json Version (${MANIFEST_VERSION}) does not match gradle.properties version (${GRADLE_VERSION})"
            exit 1
          fi
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            echo "tag version: ${TAG_VERSION}"
            if [ "${TAG_VERSION}" != "${GRADLE_VERSION}" ]; then
              echo "::error::tag ${GITHUB_REF_NAME} does not match gradle.properties version (${GRADLE_VERSION})"
              exit 1
            fi
          fi

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Cache Gradle Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Download Hytale Server Jar
        run: |
          PATCHLINE=$(grep '^patchline=' gradle.properties | cut -d= -f2)
          HYTALE_BUILD=$(grep '^hytale_build=' gradle.properties | cut -d= -f2)
          mkdir -p libs
          curl -fL -o libs/HytaleServer.jar \
            "https://maven.hytale.com/${PATCHLINE}/com/hypixel/hytale/Server/${HYTALE_BUILD}/Server-${HYTALE_BUILD}.jar"

      - name: Build with Gradle
        run: ./gradlew build

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: plugin-jar
          path: build/libs/*.jar

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Download Hytale Server Jar
        run: |
          PATCHLINE=$(grep '^patchline=' gradle.properties | cut -d= -f2)
          HYTALE_BUILD=$(grep '^hytale_build=' gradle.properties | cut -d= -f2)
          mkdir -p libs
          curl -fL -o libs/HytaleServer.jar \
            "https://maven.hytale.com/${PATCHLINE}/com/hypixel/hytale/Server/${HYTALE_BUILD}/Server-${HYTALE_BUILD}.jar"

      - name: Build with Gradle
        run: ./gradlew build

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: build/libs/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
